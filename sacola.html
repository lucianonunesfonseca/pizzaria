<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha sacola — Bella Massa</title>
  <meta name="description" content="Confira os itens da sua sacola e envie o pedido pelo WhatsApp.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="index.html">Bella <span>Massa</span></a>
    <div class="nav-links">
      <a class="nav-link" href="index.html#cardapio">Cardápio</a>
      <a class="nav-link" href="bebidas.html">Bebidas</a>
      <a class="nav-link" href="sobre.html">Sobre</a>
      <a class="nav-link" href="contato.html">Contato</a>
    </div>
  </nav>

  <header class="hero hero-small">
    <h1>Minha <span>sacola</span></h1>
  </header>

  <main>
    <noscript>
      <p class="aviso">Para usar a sacola, ative o JavaScript do navegador. Ou faça o pedido direto pelo
        <a href="https://wa.me/5562998452828">WhatsApp</a>.</p>
    </noscript>
    <p id="aviso-armazenamento" class="aviso" hidden>Seu navegador não permite guardar a sacola.
      Os itens ficam apenas enquanto você não trocar de página.</p>
    <section id="sacola"></section>

    <form id="form-pedido" class="form form-pedido" hidden>
      <h2 class="pizza-sub">Seus dados</h2>

      <fieldset class="opcoes">
        <legend>Como você quer receber?</legend>
        <div class="opcoes-linha">
          <label class="opcao">
            <input type="radio" name="tipo" value="entrega" required>
            <span class="opcao-texto">Entrega<small id="legenda-entrega"></small></span>
          </label>
          <label class="opcao">
            <input type="radio" name="tipo" value="retirada">
            <span class="opcao-texto">Retirada<small>no balcão</small></span>
          </label>
        </div>
      </fieldset>

      <p id="info-retirada" class="info-retirada" hidden></p>

      <div id="campos-entrega" class="campos-entrega" hidden>
        <label>Rua e número
          <input type="text" name="rua" autocomplete="address-line1">
        </label>
        <label>Bairro
          <input type="text" name="bairro" autocomplete="address-level3">
        </label>
        <label>Complemento ou ponto de referência (opcional)
          <input type="text" name="complemento" autocomplete="address-line2">
        </label>
      </div>

      <label>Seu nome
        <input type="text" name="nome" required autocomplete="name">
      </label>

      <fieldset class="opcoes">
        <legend>Pagamento na hora</legend>
        <div class="opcoes-linha" id="opcoes-pagamento"></div>
      </fieldset>

      <label id="campo-troco" hidden>Troco para quanto? (opcional)
        <input type="text" name="troco" inputmode="decimal" placeholder="Ex.: 100">
      </label>

      <label>Observações (opcional)
        <textarea name="obs" rows="3" placeholder="Ex.: sem cebola, campainha não funciona..."></textarea>
      </label>

      <label class="lembrar">
        <input type="checkbox" name="lembrar" checked>
        <span>Lembrar meus dados neste aparelho</span>
      </label>

      <div class="totais">
        <div id="linha-subtotal" hidden><span>Itens</span><strong id="sacola-subtotal"></strong></div>
        <div id="linha-taxa" hidden><span>Taxa de entrega</span><strong id="sacola-taxa"></strong></div>
        <div class="total-linha"><span>Total:</span><strong class="price" id="sacola-total"></strong></div>
      </div>

      <button type="submit" id="enviar" class="btn btn-big">Enviar pedido pelo WhatsApp</button>
    </form>
  </main>

  <footer>© Bella Massa — Massa fresca todos os dias</footer>

  <script src="pizzas.js"></script>
  <script src="bebidas.js"></script>
  <script src="sacola.js"></script>
  <script>
    var conteudo = document.getElementById("sacola");
    var form = document.getElementById("form-pedido");
    document.getElementById("aviso-armazenamento").hidden = ARMAZENA;

    function el(tag, className, texto) {
      var e = document.createElement(tag);
      if (className) e.className = className;
      if (texto !== undefined) e.textContent = texto;
      return e;
    }

    function botao(className, texto, rotulo, aoClicar) {
      var b = el("button", className, texto);
      b.type = "button";
      b.setAttribute("aria-label", rotulo);
      b.addEventListener("click", aoClicar);
      return b;
    }

    // ---- Formulário "Seus dados" ----

    function lerDadosFormulario() {
      function campo(nome) { return form.elements[nome].value.trim().slice(0, LIMITES[nome]); }
      var tipo = form.querySelector("input[name=tipo]:checked");
      var pagamento = form.querySelector("input[name=pagamento]:checked");
      return {
        nome: campo("nome"),
        tipo: tipo ? tipo.value : "",
        rua: campo("rua"),
        bairro: campo("bairro"),
        complemento: campo("complemento"),
        pagamento: pagamento ? pagamento.value : "",
        troco: campo("troco"),
        obs: campo("obs"),
        lembrar: form.elements["lembrar"].checked
      };
    }

    // Mostra/esconde campos, ajusta o que é obrigatório e recalcula o total.
    function atualizarFormulario() {
      var d = lerDadosFormulario();
      var entrega = d.tipo === "entrega";
      var comTaxa = entrega && TAXA_ENTREGA > 0;
      var subtotal = totalDaSacola();

      document.getElementById("campos-entrega").hidden = !entrega;
      form.elements["rua"].required = entrega;
      form.elements["bairro"].required = entrega;

      var info = document.getElementById("info-retirada");
      info.hidden = !(d.tipo === "retirada" && ENDERECO_RETIRADA);
      info.textContent = "Retirada no balcão: " + ENDERECO_RETIRADA;

      document.getElementById("campo-troco").hidden = d.pagamento !== "Dinheiro";

      document.getElementById("linha-subtotal").hidden = !comTaxa;
      document.getElementById("linha-taxa").hidden = !comTaxa;
      document.getElementById("sacola-subtotal").textContent = formatarPreco(subtotal);
      document.getElementById("sacola-taxa").textContent = formatarPreco(TAXA_ENTREGA);
      document.getElementById("sacola-total").textContent =
        formatarPreco(arredondar(subtotal + (comTaxa ? TAXA_ENTREGA : 0)));
    }

    function prepararFormulario() {
      document.getElementById("legenda-entrega").textContent =
        TAXA_ENTREGA > 0 ? "taxa " + formatarPreco(TAXA_ENTREGA) : "grátis";

      FORMAS_PAGAMENTO.forEach(function (forma, i) {
        var rotulo = el("label", "opcao");
        var radio = el("input");
        radio.type = "radio";
        radio.name = "pagamento";
        radio.value = forma;
        radio.required = i === 0; // basta marcar o primeiro do grupo como obrigatório
        rotulo.appendChild(radio);
        rotulo.appendChild(el("span", "opcao-texto", forma));
        document.getElementById("opcoes-pagamento").appendChild(rotulo);
      });

      Object.keys(LIMITES).forEach(function (nome) { form.elements[nome].maxLength = LIMITES[nome]; });

      var c = lerCliente(); // dados lembrados da última vez
      if (c) {
        form.elements["nome"].value = c.nome;
        form.elements["rua"].value = c.rua;
        form.elements["bairro"].value = c.bairro;
        form.elements["complemento"].value = c.complemento;
        var tipo = form.querySelector("input[name=tipo][value=\"" + c.tipo + "\"]");
        if (tipo) tipo.checked = true;
        var pagamento = form.querySelector("input[name=pagamento][value=\"" + c.pagamento + "\"]");
        if (pagamento) pagamento.checked = true;
      }

      form.addEventListener("change", atualizarFormulario);
      form.elements["lembrar"].addEventListener("change", function () {
        if (!form.elements["lembrar"].checked) limparCliente(); // desmarcar apaga o que estava guardado
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var dados = lerDadosFormulario();
        if (dados.lembrar) salvarCliente(dados); else limparCliente();
        marcarPedidoEnviado();
        navegarPara(linkPedidoSacola(dados));
      });
    }

    // Em função própria para os testes poderem trocar (mesma aba, sem abrir o WhatsApp).
    function navegarPara(url) {
      window.location.href = url;
    }

    // ---- Itens da sacola ----

    function podarSacola(itens) {
      // Tira da sacola o que não existe mais nos arquivos de dados.
      var validas = itens.map(function (i) { return i.chave; });
      var linhas = lerSacola();
      var mantidas = linhas.filter(function (l) { return validas.indexOf(chaveLinha(l)) !== -1; });
      if (mantidas.length !== linhas.length) salvarSacola(mantidas);
    }

    var textoVazia = "Sua sacola está vazia.";

    function montarPergunta() {
      var caixa = el("div", "aviso-envio");
      caixa.id = "pedido-enviado";
      caixa.setAttribute("role", "status");
      caixa.appendChild(el("p", "", "Você enviou o pedido pelo WhatsApp?"));
      var linha = el("div", "aviso-envio-botoes");
      var sim = el("button", "btn", "Sim, limpar a sacola");
      sim.id = "limpar-sim";
      sim.type = "button";
      sim.addEventListener("click", function () {
        limparSacola();
        textoVazia = "Pedido enviado! Sua sacola está vazia.";
        render();
      });
      var nao = el("button", "btn-sec", "Não, manter os itens");
      nao.id = "limpar-nao";
      nao.type = "button";
      nao.addEventListener("click", function () { limparMarcaEnvio(); render(); });
      linha.appendChild(sim);
      linha.appendChild(nao);
      caixa.appendChild(linha);
      return caixa;
    }

    function render() {
      var itens = itensDaSacola();
      podarSacola(itens);
      conteudo.textContent = "";
      form.hidden = itens.length === 0;

      if (itens.length === 0) {
        limparMarcaEnvio(); // sacola vazia: não há o que perguntar
        var vazia = el("p", "aviso", textoVazia);
        vazia.id = "sacola-vazia";
        conteudo.appendChild(vazia);
        var ver = el("a", "btn", "Ver o cardápio");
        ver.href = "index.html#cardapio";
        conteudo.appendChild(ver);
        return;
      }

      textoVazia = "Sua sacola está vazia.";
      if (pedidoFoiEnviado()) conteudo.appendChild(montarPergunta());

      itens.forEach(function (item) {
        var linha = el("article", "sacola-item");

        var info = el("div", "sacola-info");
        info.appendChild(el("h3", "sacola-nome", item.nome));
        if (item.detalhe) info.appendChild(el("p", "sacola-detalhe", item.detalhe));
        info.appendChild(el("p", "sacola-unit", formatarPreco(item.unit) + " cada"));
        linha.appendChild(info);

        var controles = el("div", "sacola-controles");
        var menos = botao("qtd-menos", "−", "Diminuir a quantidade de " + item.nome,
          function () { alterarQuantidade(item.chave, -1); render(); });
        menos.disabled = item.qtd <= 1;
        var mais = botao("qtd-mais", "+", "Aumentar a quantidade de " + item.nome,
          function () { alterarQuantidade(item.chave, 1); render(); });
        mais.disabled = item.qtd >= QTD_MAX;
        controles.appendChild(menos);
        controles.appendChild(el("span", "sacola-qtd", String(item.qtd)));
        controles.appendChild(mais);
        controles.appendChild(el("span", "sacola-subtotal", formatarPreco(item.subtotal)));
        controles.appendChild(botao("remover", "Remover", "Remover " + item.nome + " da sacola",
          function () { removerDaSacola(item.chave); render(); }));
        linha.appendChild(controles);

        conteudo.appendChild(linha);
      });

      var limpar = el("button", "limpar", "Limpar sacola");
      limpar.id = "limpar";
      limpar.type = "button";
      limpar.addEventListener("click", function () { limparSacola(); render(); });
      conteudo.appendChild(limpar);

      atualizarFormulario();
    }

    // Ao voltar do WhatsApp (a aba reaparece), pergunta se pode limpar a sacola.
    function revisarEnvio() {
      if (pedidoFoiEnviado() && !document.getElementById("pedido-enviado")) render();
    }
    window.addEventListener("pageshow", revisarEnvio);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) revisarEnvio(); });

    prepararFormulario();
    render();
  </script>
</body>
</html>
